spring:
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${AWS_RDS_SECRET_NAME:${DATABASE_USERNAME}}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  cloud:
    aws:
      secretsmanager:
        endpoint: http://localhost:4566
        region: ${AWS_REGION}
      credentials:
        access-key: test
        secret-key: test
  flyway:
    enabled: false

app:
  application-name: ${PROJECT_NAME:fancia}-backend-${REPO_NAME:user-cron}

logging:
  level:
    root: INFO
    com.fancia.backend.user: DEBUG
